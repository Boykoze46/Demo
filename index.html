        let cart = {};

        const formatPrice = (price) => {
            return new Intl.NumberFormat('ru-RU').format(price) + ' ₸';
        };

        window.onload = () => {
            renderMenu();
            updateCartUI(); 
            updateStaticText();
            
            if (window.innerWidth < 768) {
                const cartContent = document.getElementById('cart-content');
                cartContent.classList.remove('translate-x-full');
                cartContent.classList.add('translate-y-full');
                cartContent.style.height = '85vh';
                cartContent.style.marginTop = 'auto';
                cartContent.style.borderLeft = 'none';
                cartContent.style.borderTopLeftRadius = '20px';
                cartContent.style.borderTopRightRadius = '20px';
                
                document.getElementById('cart-modal').classList.add('items-end');
                const style = document.createElement('style');
                style.innerHTML = `
                    .modal-open #cart-content { transform: translateY(0) !important; }
                `;
                document.head.appendChild(style);
            }
        };

        function changeLang(lang) {
            currentLang = lang;
            
            // Обновляем стили кнопок
            const btnRu = document.getElementById('lang-ru');
            const btnKk = document.getElementById('lang-kk');
            
            if (lang === 'ru') {
                btnRu.className = "px-2 md:px-3 py-1.5 text-xs md:text-sm font-bold bg-gold-500 text-white transition-colors";
                btnKk.className = "px-2 md:px-3 py-1.5 text-xs md:text-sm font-bold text-gray-400 hover:text-white hover:bg-white/5 transition-colors";
            } else {
                btnKk.className = "px-2 md:px-3 py-1.5 text-xs md:text-sm font-bold bg-gold-500 text-white transition-colors";
                btnRu.className = "px-2 md:px-3 py-1.5 text-xs md:text-sm font-bold text-gray-400 hover:text-white hover:bg-white/5 transition-colors";
            }
            
            updateStaticText();
            renderMenu();
            updateCartUI();
        }

        function updateStaticText() {
            document.getElementById('city-label').innerText = i18n[currentLang].city;
            document.getElementById('cart-title').innerText = i18n[currentLang].cartTitle;
            document.getElementById('cart-subtotal-label').innerText = i18n[currentLang].subtotal;
            document.getElementById('cart-service-label').innerText = i18n[currentLang].serviceFee;
            document.getElementById('cart-total-label').innerText = i18n[currentLang].total;
            document.getElementById('order-notice').innerHTML = i18n[currentLang].orderNotice;
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('category-nav');
            container.innerHTML = '';
            navContainer.innerHTML = '';
            
            // Собираем уникальные категории на текущем языке
            const categories = [...new Set(menuItems.map(item => item.category[currentLang]))];
            
            categories.forEach(categoryName => {
                const categoryId = `category-${categoryName.replace(/\s+/g, '-')}`;
                
                const navBtn = document.createElement('a');
                navBtn.href = `#${categoryId}`;
                navBtn.className = "snap-start whitespace-nowrap px-4 py-2 rounded-full bg-card border border-white/5 text-gray-300 text-sm font-medium hover:bg-gold-500 hover:text-white hover:border-gold-500 transition-all active:scale-95";
                navBtn.innerText = categoryName;
                navContainer.appendChild(navBtn);

                const categoryItems = menuItems.filter(item => item.category[currentLang] === categoryName);
                
                const section = document.createElement('div');
                section.id = categoryId;
                section.className = "scroll-mt-40"; 
                
                let html = `
                    <div class="mb-6 flex items-center gap-4">
                        <h2 class="font-serif text-2xl md:text-3xl font-bold text-white tracking-wide">${categoryName}</h2>
                        <div class="flex-1 h-[1px] bg-gradient-to-r from-gold-500/50 to-transparent"></div>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6">
                `;
                
                categoryItems.forEach(item => {
                    html += `
                        <div class="bg-card rounded-2xl overflow-hidden shadow-lg border border-white/5 flex flex-col group transition-transform hover:-translate-y-1">
                            <div class="relative h-36 md:h-56 overflow-hidden bg-darker">
                                <img src="${item.image}" alt="${item.name[currentLang]}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e1e1e/d97706?text=Saryarka+Lounge';" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy">
                                <div class="absolute inset-0 bg-gradient-to-t from-card via-card/20 to-transparent opacity-90"></div>
                                <div class="absolute bottom-2 left-2 right-2 md:bottom-4 md:left-4 md:right-4 flex justify-between items-end">
                                    <span class="bg-dark/80 backdrop-blur text-gold-400 font-bold text-xs md:text-base px-2 py-1 md:px-3 md:py-1.5 rounded-lg border border-gold-500/30">${formatPrice(item.price)}</span>
                                </div>
                            </div>
                            <div class="p-3 md:p-5 flex-1 flex flex-col">
                                <h3 class="font-serif text-sm md:text-lg font-bold text-white leading-tight mb-1 md:mb-2">${item.name[currentLang]}</h3>
                                <p class="text-gray-400 text-[11px] md:text-sm mb-3 md:mb-5 flex-1 leading-relaxed line-clamp-3 md:line-clamp-none">${item.description[currentLang]}</p>
                                
                                <button onclick="addToCart(${item.id})" class="w-full bg-white/5 hover:bg-gold-500 hover:text-white text-gray-300 border border-white/10 hover:border-gold-500 py-2 md:py-3 rounded-xl text-xs md:text-sm font-medium transition-all flex items-center justify-center gap-1.5 md:gap-2 active:scale-95 group-hover:shadow-[0_0_15px_rgba(217,119,6,0.3)]">
                                    <i class="ph ph-plus-circle text-lg md:text-xl"></i>
                                    <span>${i18n[currentLang].addToCart}</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function addToCart(id) {
            if (cart[id]) {
                cart[id].quantity += 1;
            } else {
                const item = menuItems.find(i => i.id === id);
                cart[id] = { ...item, quantity: 1 };
            }
            updateCartUI();
            
            const fab = document.getElementById('cart-fab');
            fab.classList.add('scale-110');
            setTimeout(() => fab.classList.remove('scale-110'), 200);
        }

        function changeQuantity(id, delta) {
            if (cart[id]) {
                cart[id].quantity += delta;
                if (cart[id].quantity <= 0) {
                    delete cart[id];
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSubtotal = document.getElementById('cart-subtotal');
            const cartService = document.getElementById('cart-service');
            const cartTotal = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            
            cartItemsContainer.innerHTML = '';
            let subtotalSum = 0;
            let totalItems = 0;
            
            const cartValues = Object.values(cart);
            
            if (cartValues.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center flex flex-col items-center justify-center h-full text-gray-500 mt-10">
                        <div class="bg-white/5 p-6 rounded-full mb-4">
                            <i class="ph ph-basket text-5xl opacity-50"></i>
                        </div>
                        <p class="text-lg font-medium text-gray-400">${i18n[currentLang].emptyCart}</p>
                        <p class="text-sm mt-2 text-gray-500 max-w-[200px] mx-auto">${i18n[currentLang].emptyDesc}</p>
                    </div>
                `;
                badge.classList.add('hidden');
            } else {
                badge.classList.remove('hidden');
                
                cartValues.forEach(item => {
                    subtotalSum += item.price * item.quantity;
                    totalItems += item.quantity;
                    
                    const itemEl = document.createElement('div');
                    itemEl.className = 'flex items-center gap-3 bg-gradient-to-r from-card to-dark/50 p-3 rounded-xl border border-white/5 shadow-sm relative overflow-hidden group';
                    
                    itemEl.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-gold-500/50"></div>
                        <img src="${item.image}" alt="${item.name[currentLang]}" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e1e1e/d97706?text=${i18n[currentLang].photoFallback}';" class="w-16 h-16 rounded-lg object-cover shadow-md ml-1">
                        <div class="flex-1 min-w-0 pr-2">
                            <h4 class="text-sm font-semibold text-white truncate mb-1">${item.name[currentLang]}</h4>
                            <p class="text-gold-400 text-sm font-medium">${formatPrice(item.price * item.quantity)}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-darker rounded-lg p-1 border border-white/10 shadow-inner">
                            <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 rounded-md transition-colors active:scale-95">
                                <i class="ph ph-minus"></i>
                            </button>
                            <span class="w-5 text-center text-sm font-bold text-white">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 rounded-md transition-colors active:scale-95">
                                <i class="ph ph-plus text-gold-500"></i>
                            </button>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemEl);
                });
            }
            
            const serviceFee = Math.round(subtotalSum * 0.10);
            const grandTotal = subtotalSum + serviceFee;

            badge.innerText = totalItems;
            if (cartSubtotal) cartSubtotal.innerText = formatPrice(subtotalSum);
            if (cartService) cartService.innerText = formatPrice(serviceFee);
            if (cartTotal) cartTotal.innerText = formatPrice(grandTotal);
        }

        function toggleCart() {
            const body = document.body;
            body.classList.toggle('modal-open');
            
            if (body.classList.contains('modal-open')) {
                body.style.overflow = 'hidden'; 
            } else {
                body.style.overflow = '';
            }
        }
    </script>
